name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 fonts-dejavu-core
      - run: python -m pip install -e . pytest
      - name: Offscreen regression suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
